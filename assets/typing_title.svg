<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="800" height="48">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&amp;display=swap');
      
      .text {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 21px;
        font-weight: 600;
        fill: #38bdf8;
        text-anchor: middle;
        dominant-baseline: central;
      }

      /* Cycle through 4 coherent engineering roles over 14s (3.5s each) */
      .phrase-1 { animation: cycle1 14s infinite; }
      .phrase-2 { animation: cycle2 14s infinite; }
      .phrase-3 { animation: cycle3 14s infinite; }
      .phrase-4 { animation: cycle4 14s infinite; }

      @keyframes cycle1 {
        0%, 21% { opacity: 1; transform: translateY(0); }
        25%, 96% { opacity: 0; transform: translateY(-4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycle2 {
        0%, 21% { opacity: 0; transform: translateY(4px); }
        25%, 46% { opacity: 1; transform: translateY(0); }
        50%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycle3 {
        0%, 46% { opacity: 0; transform: translateY(4px); }
        50%, 71% { opacity: 1; transform: translateY(0); }
        75%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycle4 {
        0%, 71% { opacity: 0; transform: translateY(4px); }
        75%, 96% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-4px); }
      }
    </style>
  </defs>

  <g transform="translate(400, 24)">
    <g class="phrase-1">
      <text class="text" x="0" y="0">MSc in Electronic Systems (Civilingeniør)</text>
    </g>
    <g class="phrase-2">
      <text class="text" x="0" y="0">Embedded Systems Engineer</text>
    </g>
    <g class="phrase-3">
      <text class="text" x="0" y="0">Signal Processing &amp; Control Engineer</text>
    </g>
    <g class="phrase-4">
      <text class="text" x="0" y="0">BSc in Electronics &amp; IT (Process Control)</text>
    </g>
  </g>
</svg>
