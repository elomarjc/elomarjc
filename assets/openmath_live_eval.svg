<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="160">
  <defs>
    <linearGradient id="omGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
    <linearGradient id="plotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      @keyframes drawCurve {
        0% { stroke-dashoffset: 600; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes stepFade1 {
        0%, 15% { opacity: 0; }
        25%, 100% { opacity: 1; }
      }
      @keyframes stepFade2 {
        0%, 45% { opacity: 0; }
        55%, 100% { opacity: 1; }
      }
      .curve {
        stroke-dasharray: 600;
        animation: drawCurve 4s ease-in-out infinite;
      }
      .cursor { animation: blinkCursor 0.9s infinite; }
      .step1 { animation: stepFade1 4s ease-in-out infinite; }
      .step2 { animation: stepFade2 4s ease-in-out infinite; }
      .term-code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
      }
    </style>
  </defs>

  <rect width="420" height="160" rx="10" fill="url(#omGrad)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top bar -->
  <rect width="420" height="26" rx="10" fill="#0b1322"/>
  <rect y="20" width="420" height="6" fill="#0b1322"/>
  <line x1="0" y1="26" x2="420" y2="26" stroke="#1e293b" stroke-width="1"/>
  
  <circle cx="16" cy="13" r="3.5" fill="#ef4444"/>
  <circle cx="28" cy="13" r="3.5" fill="#f59e0b"/>
  <circle cx="40" cy="13" r="3.5" fill="#10b981"/>
  
  <text x="56" y="16.5" fill="#94a3b8" font-size="9" font-family="monospace" font-weight="700">OPENMATH CAS // SYMBOLIC COMPUTATION ENGINE</text>
  <circle cx="395" cy="13" r="3" fill="#10b981" class="cursor"/>

  <!-- Terminal content -->
  <g class="term-code">
    <text x="16" y="44" fill="#38bdf8">&gt;&gt; diff(sin(x) * exp(-0.15*x), x)<tspan class="cursor" fill="#38bdf8">_</tspan></text>
    
    <g class="step1">
      <text x="16" y="60" fill="#64748b">↳ SymPy Derivative Rule: Chain + Product</text>
      <text x="16" y="76" fill="#34d399">=&gt; exp(-0.15*x) * (cos(x) - 0.15*sin(x))</text>
    </g>

    <g class="step2">
      <text x="16" y="93" fill="#f59e0b">&gt;&gt; plot2d(y, x=[-10, 10], precision=50)</text>
    </g>
  </g>

  <!-- Mini Animated Dynamic Plot Area -->
  <g transform="translate(16, 102)">
    <rect width="388" height="46" rx="6" fill="#050912" stroke="#1e293b" stroke-width="0.8"/>
    <!-- Grid -->
    <line x1="0" y1="23" x2="388" y2="23" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="3,3"/>
    <line x1="194" y1="0" x2="194" y2="46" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="3,3"/>
    
    <!-- Animated damped oscillation plot -->
    <path class="curve" d="M 10 23 
             Q 35 3, 60 23 T 110 23 T 160 23 T 210 23 
             T 260 23 T 310 23 T 360 23" 
          fill="none" stroke="url(#plotGrad)" stroke-width="1.8"/>

    <text x="310" y="40" fill="#64748b" font-size="8" font-family="monospace">DAMPED HARMONIC</text>
  </g>
</svg>
