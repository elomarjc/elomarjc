<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>

    <!-- Signal Gradients -->
    <linearGradient id="cyanWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2,2"/>
    </pattern>

    <style>
      @keyframes waveScroll1 {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }
      @keyframes waveScroll2 {
        0% { transform: translateX(0); }
        100% { transform: translateX(400px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .wave1 {
        animation: waveScroll1 10s linear infinite;
      }
      .wave2 {
        animation: waveScroll2 14s linear infinite;
      }
      .blinker {
        animation: blink 1.2s ease-in-out infinite;
      }
      .terminal-font {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Background Card with Border -->
  <rect x="2" y="2" width="896" height="176" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="176" rx="14" fill="url(#grid)" opacity="0.65"/>

  <!-- Top Status Bar -->
  <g class="terminal-font" font-size="10" fill="#64748b">
    <circle cx="24" cy="22" r="4.5" fill="#ef4444"/>
    <circle cx="38" cy="22" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="22" r="4.5" fill="#10b981"/>
    
    <text x="75" y="25" fill="#94a3b8" font-weight="600" letter-spacing="1">ELOMARJC // REAL-TIME SYSTEM ARCHITECTURE &amp; TELEMETRY</text>
    
    <circle cx="780" cy="22" r="3.5" fill="#10b981" class="blinker"/>
    <text x="792" y="25" fill="#10b981" font-weight="700">KERNEL ONLINE</text>
  </g>

  <!-- Horizontal Center Line -->
  <line x1="20" y1="100" x2="880" y2="100" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Animated Waveform 1: Audio / DSP Carrier Sine Wave -->
  <g class="wave1">
    <path d="M 0 100 
             Q 50 45, 100 100 T 200 100 T 300 100 T 400 100 
             T 500 100 T 600 100 T 700 100 T 800 100 
             T 900 100 T 1000 100 T 1100 100 T 1200 100 
             T 1300 100 T 1400 100 T 1500 100 T 1600 100 
             T 1700 100 T 1800 100" 
          fill="none" stroke="url(#cyanWaveGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Animated Waveform 2: State Estimation / Closed-Loop Feedback Wave -->
  <g class="wave2">
    <path d="M -400 100 
             C -340 140, -300 60, -240 100 
             S -180 140, -120 100 
             S -60 50, 0 100 
             S 60 150, 120 100 
             S 180 50, 240 100 
             S 300 150, 360 100 
             S 420 50, 480 100 
             S 540 150, 600 100 
             S 660 50, 720 100 
             S 780 150, 840 100 
             S 900 50, 960 100 
             S 1020 150, 1080 100 
             S 1140 50, 1200 100 
             S 1260 150, 1320 100" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="1.8" stroke-dasharray="6,4"/>
  </g>

  <!-- Digital Pulse Train (Clock/Bus) in Background -->
  <path d="M 20 135 L 70 135 L 70 120 L 120 120 L 120 135 L 170 135 L 170 120 L 220 120 L 220 135 L 270 135 L 270 120 L 320 120 L 320 135 L 370 135 L 370 120 L 420 120 L 420 135 L 470 135 L 470 120 L 520 120 L 520 135 L 570 135 L 570 120 L 620 120 L 620 135 L 670 135 L 670 120 L 720 120 L 720 135 L 770 135 L 770 120 L 820 120 L 820 135 L 880 135" 
        fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.35"/>

  <!-- Telemetry Pills Footer -->
  <g class="terminal-font" font-size="9.5" font-weight="600">
    <!-- Tag 1 -->
    <rect x="22" y="148" width="168" height="20" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="34" cy="158" r="3" fill="#38bdf8"/>
    <text x="44" y="162" fill="#cbd5e1">DSP // SNR GAIN: +34 dB</text>

    <!-- Tag 2 -->
    <rect x="200" y="148" width="205" height="20" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="212" cy="158" r="3" fill="#10b981"/>
    <text x="222" y="162" fill="#cbd5e1">MOBILE // DART FFI + C++ SOLOUD</text>

    <!-- Tag 3 -->
    <rect x="415" y="148" width="210" height="20" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="427" cy="158" r="3" fill="#f59e0b"/>
    <text x="437" y="162" fill="#cbd5e1">ROBOTICS // UWB + CV FUSION</text>

    <!-- Tag 4 -->
    <rect x="635" y="148" width="242" height="20" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="647" cy="158" r="3" fill="#ec4899"/>
    <text x="657" y="162" fill="#cbd5e1">SECURITY // X25519 + AES-256-GCM</text>
  </g>
</svg>
