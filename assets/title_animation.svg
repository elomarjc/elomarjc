<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 44" width="700" height="44">
  <defs>
    <style>
      .title-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 20px;
        font-weight: 600;
        fill: #38bdf8;
        text-anchor: middle;
        dominant-baseline: central;
        will-change: opacity, transform;
      }

      /* 3 roles cycled over 10.5 seconds (3.5s per role) with 60fps GPU acceleration */
      .role-1 { animation: cycleRole1 10.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .role-2 { animation: cycleRole2 10.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .role-3 { animation: cycleRole3 10.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

      @keyframes cycleRole1 {
        0%, 28%   { opacity: 1; transform: translateY(0); }
        33.3%, 95% { opacity: 0; transform: translateY(-4px); }
        100%      { opacity: 1; transform: translateY(0); }
      }

      @keyframes cycleRole2 {
        0%, 28%   { opacity: 0; transform: translateY(4px); }
        33.3%, 61% { opacity: 1; transform: translateY(0); }
        66.6%, 100%{ opacity: 0; transform: translateY(-4px); }
      }

      @keyframes cycleRole3 {
        0%, 61%   { opacity: 0; transform: translateY(4px); }
        66.6%, 95%{ opacity: 1; transform: translateY(0); }
        100%      { opacity: 0; transform: translateY(-4px); }
      }
    </style>
  </defs>

  <g transform="translate(350, 22)">
    <g class="role-1">
      <text class="title-text" x="0" y="0">MSc in Electronic Systems</text>
    </g>
    <g class="role-2">
      <text class="title-text" x="0" y="0">Embedded Systems Engineer</text>
    </g>
    <g class="role-3">
      <text class="title-text" x="0" y="0">Software Developer</text>
    </g>
  </g>
</svg>
